[tool.pixi.workspace]
authors = ["Samuel Ibarra <ing.samuelibarra@gmail.com>"]
channels = ["https://prefix.dev/max-nightly", "https://prefix.dev/conda-forge"]
name = "strata"
platforms = [
    { name = "linux-64-glibc-2-34", platform = "linux-64", glibc = "2.34" },
    "osx-arm64",
]
version = "0.0.1"
preview = ["pixi-build"]

[tool.pixi.package]
name = "strata"
version = "0.0.1"
description = "Series/Parallel Runner on top of mojo asyncrt"

[tool.pixi.package.build]
backend = { name = "pixi-build-mojo", version = "0.*" }

[tool.pixi.package.host-dependencies]
mojo-compiler = "<=2.0.0"

[tool.pixi.package.build-dependencies]
mojo-compiler = "<=2.0.0"

[tool.pixi.package.run-dependencies]
mojo-compiler = "<=2.0.0"

[tool.pixi.pypi-dependencies]
mojo = ">=1.2.0,<2.0.0"

[tool.pixi.tasks]
build_package = "mojo precompile src/ -o package/strata.mojoc"
build_mojo_python = "mojo build src/interop/python_interop.mojo --emit shared-lib -o python/src/strata/mojo_strata.so"
build_all = { depends-on = ["build_package", "build_mojo_python"] }

async_mutable_task_examples = "mojo examples/async_mutable_task_examples.mojo"
generic_async_examples = "mojo examples/generic_async_examples.mojo"

compile-for-testing = "mojo precompile src/ -o tests/strata.mojoc"
test_generic = { cmd = "mojo test_generic.mojo", cwd = "tests", depends-on = ["compile-for-testing"] }
test_generic_compt = { cmd = "mojo test_generic_compt.mojo", cwd = "tests", depends-on = ["compile-for-testing"] }
test_generic_async = { cmd = "mojo test_generic_async.mojo", cwd = "tests", depends-on = ["compile-for-testing"] }
test_void_type = { cmd = "mojo test_void_type.mojo", cwd = "tests", depends-on = ["compile-for-testing"] }
test_void_immutable = { cmd = "mojo test_void_immutable.mojo", cwd = "tests", depends-on = ["compile-for-testing"] }
test_void_mutable = { cmd = "mojo test_void_mutable.mojo", cwd = "tests", depends-on = ["compile-for-testing"] }
test_void_async_immutable = { cmd = "mojo test_void_async_immutable.mojo", cwd = "tests", depends-on = ["compile-for-testing"] }
test_void_async_mutable = { cmd = "mojo test_void_async_mutable.mojo", cwd = "tests", depends-on = ["compile-for-testing"] }

test_runners = { depends-on = [
    "test_generic",
    "test_generic_compt",
    "test_generic_async",
    "test_void_type",
    "test_void_immutable",
    "test_void_mutable",
    "test_void_async_immutable",
    "test_void_async_mutable",
] }
python_test = "cd python && uv run --no-build-isolation --reinstall-package strata --group dev --group test pytest"

test_docs = "mojo run tests/test_docs_completeness.mojo"
tests = { depends-on = ["test_runners", "python_test", "test_docs"] }
