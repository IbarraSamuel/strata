[tool.pixi.workspace]
authors = ["Samuel Ibarra <ing.samuelibarra@gmail.com>"]
channels = ["https://prefix.dev/max-nightly", "https://prefix.dev/conda-forge"]
name = "strata"
platforms = ["linux-64", "osx-arm64"]
version = "2.0.0"
preview = ["pixi-build"]
channel-priority = "disabled"

[tool.pixi.package]
name = "strata"
version = "2.0.0"
description = "Series/Parallel Runner on top of mojo asyncrt"

[tool.pixi.package.build]
backend = { name = "pixi-build-mojo", version = "0.*" }

[tool.pixi.package.host-dependencies]
mojo-compiler = "<=2.0.0"

[tool.pixi.package.build-dependencies]
mojo-compiler = "<=2.0.0"

[tool.pixi.package.run-dependencies]
mojo-compiler = "<=2.0.0"

[tool.pixi.dependencies]
mojo = "<=2.0.0"

[tool.pixi.tasks]
build_package = "mojo precompile src/ -o package/strata.mojoc"
build_mojo_python = "mojo build src/interop/python_interop.mojo --emit shared-lib -o python/src/strata/mojo_strata.so"
build_all = { depends-on = ["build_package", "build_mojo_python"] }

generic_pipeline_example = { cmd = "mojo -I package examples/generic_pipeline.mojo", depends-on = [
    "build_package",
] }

compile-for-testing = "mojo precompile src/ -o tests/strata.mojoc"
test_pipeline = { cmd = "mojo test_pipeline.mojo", cwd = "tests", depends-on = [
    "compile-for-testing",
] }
test_pipeline_compt = { cmd = "mojo test_pipeline_compt.mojo", cwd = "tests", depends-on = [
    "compile-for-testing",
] }
test_pipeline_async = { cmd = "mojo test_pipeline_async.mojo", cwd = "tests", depends-on = [
    "compile-for-testing",
] }
test_pipeline_fallible = { cmd = "mojo test_pipeline_fallible.mojo", cwd = "tests", depends-on = [
    "compile-for-testing",
] }
test_stateful = { cmd = "mojo test_stateful.mojo", cwd = "tests", depends-on = [
    "compile-for-testing",
] }
test_stateful_async = { cmd = "mojo test_stateful_async.mojo", cwd = "tests", depends-on = [
    "compile-for-testing",
] }
test_executors = { cmd = "mojo test_executors.mojo", cwd = "tests", depends-on = [
    "compile-for-testing",
] }
test_combinators = { cmd = "mojo test_combinators.mojo", cwd = "tests", depends-on = [
    "compile-for-testing",
] }
test_resilience = { cmd = "mojo test_resilience.mojo", cwd = "tests", depends-on = [
    "compile-for-testing",
] }
test_introspect = { cmd = "mojo test_introspect.mojo", cwd = "tests", depends-on = [
    "compile-for-testing",
] }
test_stream_and_abi = { cmd = "mojo test_stream_and_abi.mojo", cwd = "tests", depends-on = [
    "compile-for-testing",
] }
test_edge_cases = { cmd = "mojo test_edge_cases.mojo", cwd = "tests", depends-on = [
    "compile-for-testing",
] }

test_runners = { depends-on = [
    "test_pipeline",
    "test_pipeline_compt",
    "test_pipeline_async",
    "test_pipeline_fallible",
    "test_stateful",
    "test_stateful_async",
    "test_executors",
    "test_combinators",
    "test_resilience",
    "test_introspect",
    "test_stream_and_abi",
    "test_edge_cases",
] }
python_test = "cd python && uv sync --no-install-project --group dev --group test && uv run --no-build-isolation --reinstall-package strata --group dev --group test pytest"

test_docs = "mojo run tests/test_docs_completeness.mojo"
tests = { depends-on = ["test_runners", "python_test", "test_docs"] }
